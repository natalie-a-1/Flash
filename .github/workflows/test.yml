# File: Test.yml
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js for Root
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Setup npm configuration (Root)
        run: |
          echo "omit=optional" > .npmrc
          echo "platform=linux" >> .npmrc
          echo "optional=false" >> .npmrc
          echo "loglevel=error" >> .npmrc
          npm config set ignore-scripts true

      - name: Install root dependencies
        env:
          npm_config_optional: false
        run: npm install --force

      - name: Install Ganache
        run: npm install -g ganache

      - name: Run smart contract tests
        env:
          # Pass the secret RPC URL to the steps
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          NODE_ENV: test
        run: |
          # Start Ganache in the background, forking Sepolia using the provided RPC URL
          # Use port 8545 to match truffle-config.js
          ganache --fork "$SEPOLIA_RPC_URL" --port 8545 > ganache.log 2>&1 &

          # Wait a few seconds for Ganache to initialize the fork
          echo "Waiting for Ganache fork to start..."
          sleep 10 

          # Check if Ganache started correctly (optional but helpful)
          if ! pgrep -f ganache; then
            echo "Ganache failed to start. Check logs:"
            cat ganache.log
            exit 1
          fi
          echo "Ganache started. Running fork tests..."

          # Run the specific fork test script
          npm run test:fork

      - name: Setup Node.js for Frontend
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup npm configuration (Frontend)
        run: |
          echo "omit=optional" > .npmrc
          echo "platform=linux" >> .npmrc
          echo "optional=false" >> .npmrc
          echo "loglevel=error" >> .npmrc
          npm config set ignore-scripts true
        working-directory: frontend

      - name: Install frontend dependencies
        env:
          npm_config_optional: false
        run: npm ci --omit=optional --ignore-scripts --force
        working-directory: frontend

      - name: Run frontend tests
        if: false
        run: npm test
        working-directory: frontend
        env:
          NEXT_PUBLIC_NETWORK_ID: 11155111 # Sepolia testnet
          NODE_ENV: test

      - name: Check formatting
        run: npm run check:format
