# File: Test.yml
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js for Root
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup npm configuration (Root)
        run: |
          echo "omit=optional" > .npmrc
          echo "platform=linux" >> .npmrc
          echo "optional=false" >> .npmrc
          echo "loglevel=error" >> .npmrc
          npm config set ignore-scripts true

      - name: Remove fsevents from package-lock (Root)
        run: |
          if [ -f package-lock.json ]; then
            echo "Attempting to remove fsevents references..."
            # Use multiple jq passes for more robust removal
            jq 'del(.packages."node_modules/fsevents")' package-lock.json > temp && mv temp package-lock.json
            jq 'walk(if type == "object" and .dependencies? != null then .dependencies |= (del(.fsevents) // .) else . end)' package-lock.json > temp && mv temp package-lock.json
            jq 'walk(if type == "object" and .optionalDependencies? != null then .optionalDependencies |= (del(.fsevents) // .) else . end)' package-lock.json > temp && mv temp package-lock.json
            echo "Finished removing fsevents references."
          fi

      - name: Verify fsevents removal (Root)
        run: |
          if grep -q '"fsevents":' package-lock.json; then
            echo "Error: fsevents is still present in package-lock.json."
            exit 1
          else
            echo "fsevents successfully removed from package-lock.json."
          fi

      - name: Install root dependencies
        env:
          npm_config_optional: false
        run: npm ci --omit=optional --ignore-scripts

      - name: Run smart contract tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Setup Node.js for Frontend
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup npm configuration (Frontend)
        run: |
          echo "omit=optional" > .npmrc
          echo "platform=linux" >> .npmrc
          echo "optional=false" >> .npmrc
          echo "loglevel=error" >> .npmrc
          npm config set ignore-scripts true
        working-directory: frontend

      - name: Remove fsevents from package-lock (Frontend)
        run: |
          if [ -f package-lock.json ]; then
            echo "Attempting to remove fsevents references from frontend..."
            # Use multiple jq passes for more robust removal
            jq 'del(.packages."node_modules/fsevents")' package-lock.json > temp && mv temp package-lock.json
            jq 'walk(if type == "object" and .dependencies? != null then .dependencies |= (del(.fsevents) // .) else . end)' package-lock.json > temp && mv temp package-lock.json
            jq 'walk(if type == "object" and .optionalDependencies? != null then .optionalDependencies |= (del(.fsevents) // .) else . end)' package-lock.json > temp && mv temp package-lock.json
            echo "Finished removing fsevents references from frontend."
          fi
        working-directory: frontend

      - name: Verify fsevents removal (Frontend)
        run: |
          if grep -q '"fsevents":' package-lock.json; then
            echo "Error: fsevents is still present in frontend/package-lock.json."
            exit 1
          else
            echo "fsevents successfully removed from frontend/package-lock.json."
          fi
        working-directory: frontend

      - name: Install frontend dependencies
        env:
          npm_config_optional: false
        run: npm ci --omit=optional --ignore-scripts
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend
        env:
          NEXT_PUBLIC_NETWORK_ID: 11155111  # Sepolia testnet
          NODE_ENV: test
